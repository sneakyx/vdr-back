# .github/workflows/docker-build.yml
name: Build and push VDR image

on:
  push:
  # No branches filter: the workflow runs on EVERY branch.
  # The branch name (sanitized) becomes the Docker tag.

jobs:
  build:
    runs-on: ubuntu-latest
    # Guard: a branch called "latest" must never overwrite the
    # rollback image sneaky/vdr:latest (the old VDR 2.4.0)!
    if: github.ref_name != 'latest'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive Docker tag from branch name
        id: tag
        run: |
          TAG=$(echo "$GITHUB_REF_NAME" | sed -E 's#[^a-zA-Z0-9._-]+#-#g' | tr '[:upper:]' '[:lower:]')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: sneaky/vdr:${{ steps.tag.outputs.tag }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}